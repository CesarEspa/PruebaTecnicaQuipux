global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "earthquake_api"
    metrics_path: /observability/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "earthquake_ingestion"
    static_configs:
      - targets: ["ingestion:9101"]

  - job_name: "earthquake_consumer"
    static_configs:
      - targets: ["consumer:9102"]
